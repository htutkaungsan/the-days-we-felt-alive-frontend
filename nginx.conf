server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend http://host.docker.internal:3017;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / { try_files $uri $uri/ /index.html; }
}
